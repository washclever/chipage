<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아날로그 칩 설계 도구</title>
<meta name="description" content="회로도와 SPICE 시뮬레이션에서 PDK에 맞는 GDS까지, 브라우저에서.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070A11'/%3E%3Crect x='7' y='9' width='18' height='14' fill='none' stroke='%239DB8D2' stroke-width='1.5'/%3E%3Cpath d='M11 13h10M11 16h10M11 19h10' stroke='%23E8590C' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500&family=Inter:ital,wght@1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/style.css">
<!-- the scene's code, fetched at once and side by side while the loading drawing starts (main.js builds the scene once its first lines are down) -->
<link rel="modulepreload" href="./vendor/three.js"><link rel="modulepreload" href="./src/stage.js"><link rel="modulepreload" href="./src/world.js"><link rel="modulepreload" href="./src/shade.js">
<link rel="modulepreload" href="./src/water.js"><link rel="modulepreload" href="./src/fluid.js"><link rel="modulepreload" href="./src/hash.js"><link rel="modulepreload" href="./src/memory.js"><link rel="modulepreload" href="./src/film.js">
</head>
<body>
<!-- the scene, drawn live on the GPU (WebGPU, or WebGL 2), and over it what is drawn in 2D through the same camera -->
<canvas id="stage" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<!-- while the scene loads: the construction drawing of the first picture (main.js) -->
<canvas id="sketch" aria-hidden="true"></canvas>
<!-- and over it, that the page is loading, and a warning for whoever flashing light can harm: in the page's language, then in the other -->
<div id="notice" role="status"><p class="ld"><span data-t="loading"></span><i></i><i></i><i></i></p><p class="warn" data-t="warn"></p><p class="warn other"></p></div>
<div id="shade" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="#" data-t="brand"></a>
  <nav class="actions">
    <button class="lang" type="button" data-t="other"></button>
    <a class="btn ghost" href="#deck" data-t="deck"></a>
    <a class="btn" href="https://washclever.github.io/melange/" target="_blank" rel="noopener" data-t="demo"></a>
  </nav>
</header>

<!-- the product's wordmark, and the line the visitor types -->
<p id="logo" aria-hidden="true">Melange</p>
<div id="prompt" aria-hidden="true"><span class="gt">&gt;</span></div>

<main id="copy">
  <section class="st"><p class="k"></p><h1 class="h"></h1><p class="p"></p></section>
  <section class="st"><p class="k"></p><h2 class="h"></h2><p class="p"></p></section>
  <section class="st"><p class="k"></p><h2 class="h"></h2><p class="p"></p><p class="n"></p></section>
  <section class="st"><p class="k"></p><h2 class="h"></h2><p class="p"></p></section>
  <section class="st"><p class="k"></p><h2 class="h"></h2><p class="p"></p></section>
  <section class="st"><p class="k"></p><h2 class="h"></h2><p class="p"></p></section>
  <section class="st"><p class="k"></p><h2 class="h"></h2><p class="p"></p></section>
  <section class="st"><p class="k"></p><h2 class="h"></h2><p class="p"></p></section>
  <section class="st" id="contact"><p class="k"></p><h2 class="h"></h2><ul class="list"></ul><p class="p"></p>
    <p class="cta"><a class="btn ghost" href="#deck" data-t="deck"></a><a class="btn" href="https://washclever.github.io/melange/" target="_blank" rel="noopener" data-t="demo"></a></p></section>
  <section class="st" id="about"><p class="k"></p><h2 class="h"></h2><p class="p"></p><ul class="list"></ul>
    <p class="cta"><a class="btn ghost" href="#deck" data-t="deck"></a><a class="btn" href="https://washclever.github.io/melange/" target="_blank" rel="noopener" data-t="demo"></a></p></section>
</main>

<!-- names on the schematic and on the blocks of the layout, placed by the same camera -->
<div id="labels" aria-hidden="true"></div>
<p id="tip" aria-hidden="true"></p>

<!-- the layers of the layout: lit as they rise, filled as they are laid -->
<aside class="panel" id="legend" aria-hidden="true">
  <p class="pk"><span data-t="layers"></span></p>
  <ol></ol>
</aside>

<nav id="rail" aria-label="sections"></nav>
<p id="hint"><span data-t="scroll"></span><i></i></p>
<div id="cur" aria-hidden="true"></div>
<div id="track"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
